<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Math Adventure - 50 Levels</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Bubblegum Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 12vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background: rgba(255, 255, 255, 0.85);
            border-bottom: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            margin: 0;
            color: #ff6b6b;
            font-size: 1.5rem;
        }

        .level-badge {
            background: #ffde59;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: #333;
            font-size: 1.1rem;
            border: 2px solid #fff;
        }

        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
        }

        .prompt-bubble {
            background: white;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 1.4rem;
            color: #333;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            border: 3px solid #ffde59;
            text-align: center;
            max-width: 90%;
        }

        .drop-zones-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .drop-zone {
            min-width: 130px;
            min-height: 130px;
            background: rgba(255, 255, 255, 0.65);
            border: 4px dashed #ff6b6b;
            border-radius: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 10px;
            gap: 8px;
            transition: all 0.25s ease;
            position: relative;
        }

        .drop-zone::after {
            content: attr(data-label);
            position: absolute;
            bottom: -24px;
            font-size: 0.95rem;
            color: #2c3e50;
            font-weight: bold;
            background: rgba(255,255,255,0.8);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .drop-zone.highlight {
            background: rgba(255, 222, 89, 0.5);
            border-color: #f1c40f;
            transform: scale(1.06);
        }

        .drop-zone.completed {
            background: rgba(46, 204, 113, 0.35);
            border: 4px solid #2ecc71;
        }

        .tray {
            height: 26vh;
            background: rgba(255, 255, 255, 0.92);
            border-top: 4px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 10px 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
        }

        .item {
            width: 60px;
            height: 60px;
            font-size: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            touch-action: none;
            transition: transform 0.15s;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.2));
        }

        .item.dragging {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            transform: scale(1.25);
        }

        .celebration {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #ffde59;
            padding: 25px 35px;
            border-radius: 30px;
            font-size: 1.8rem;
            color: #d63031;
            border: 5px solid #fff;
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .celebration.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .next-btn {
            background: #2ecc71;
            color: white;
            border: 3px solid #fff;
            padding: 12px 28px;
            font-size: 1.4rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .next-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
